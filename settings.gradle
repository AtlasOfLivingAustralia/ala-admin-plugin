pluginManagement {
    repositories {
        mavenLocal()
        maven { url "https://nexus.ala.org.au/content/groups/public/" }
        maven { url "https://repo.grails.org/grails/core" }
        gradlePluginPortal()
    }

    plugins {
        id "org.grails.grails-gsp" version "$grailsGradlePluginVersion"
        id "org.grails.grails-plugin" version "$grailsGradlePluginVersion"
        id "com.bertramlabs.asset-pipeline" version "4.3.0"
    }
}

rootProject.name='ala-admin-plugin'
