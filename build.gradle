buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://nexus.ala.org.au/content/groups/public/" }
        maven { url "https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath "org.apache.grails:grails-gradle-plugins:$grailsGradlePluginVersion"
    }
}

plugins {
    id "groovy"
    id "application"
    id "com.gorylenko.gradle-git-properties" version "2.4.1"
    id "maven-publish"
    id "cloud.wondrify.asset-pipeline" version "5.0.32"
}

version "3.0.0-SNAPSHOT"
group "org.grails.plugins"

apply plugin:"eclipse"
apply plugin:"idea"
apply plugin:"org.apache.grails.gradle.grails-plugin"
apply plugin:"org.apache.grails.gradle.grails-gsp"
apply plugin:"maven-publish"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
    maven { url "https://repo.grails.org/grails/core" }
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
}

dependencies {
    compileOnly platform("org.apache.grails:grails-bom:$grailsVersion")
    testImplementation platform("org.apache.grails:grails-bom:$grailsVersion")

    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "cloud.wondrify:asset-pipeline-grails:5.0.32"
    compileOnly "org.apache.grails:grails-core"
    testImplementation "org.apache.grails:grails-core"
    compileOnly "org.apache.grails:grails-controllers"
    profile "org.apache.grails.profiles:web-plugin"
    console "org.apache.grails:grails-console"
    compileOnly "org.apache.grails:grails-web-boot"
    testImplementation "org.apache.grails:grails-web-boot"
    gspCompile "org.apache.grails:grails-gsp"

    //runtimeOnly "com.bertramlabs.plugins:asset-pipeline-grails:2.14.2"
    testImplementation "org.apache.grails:grails-testing-support-web"

    // Grails plugin dependencies
//    compile 'org.grails.plugins:cache:3.0.3' // provided by Grails
//    compile ":build-info:1.2.8" // No Grails 3 version yet

    // Regular JAR dependencies
    implementation "org.apache.httpcomponents:httpclient:4.5.3"
}

//bootRun {
//    jvmArgs('-Dspring.output.ansi.enabled=always')
//    addResources = true
//}
// enable if you wish to package this plugin as a standalone application

assets {
    packagePlugin = true
}

publishing {
    repositories {
        maven {
            name 'Nexus'
            url "https://nexus.ala.org.au/content/repositories/${project.version.endsWith('-SNAPSHOT') ? 'snapshots' : 'releases' }"
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }
    publications {
        mavenJar(MavenPublication) {
            from components.java

        }
    }
}
